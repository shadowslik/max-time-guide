services:
  # Обратный прокси + автоматический HTTPS (Let's Encrypt).
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  # Мини-приложение (React через nginx). Наружу его отдаёт Caddy.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_ORS_API_KEY: ${VITE_ORS_API_KEY:-}
        VITE_MAPTILER_KEY: ${VITE_MAPTILER_KEY:-}
    restart: unless-stopped

  # Бэкенд: API (/api/*) и чат-бот MAX — в одном процессе (backend/app/main.py).
  backend:
    build: ./backend
    env_file: .env
    restart: unless-stopped
    # SQLite-файл (профиль, история маршрутов) — на томе, чтобы переживал пересборку.
    volumes:
      - backend_data:/app/backend/data

volumes:
  caddy_data:
  caddy_config:
  backend_data:
